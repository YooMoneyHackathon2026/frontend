schema: spec-driven

context: |
  Документация и фронтенд хакатона ЮKassa, Трек 2.
  Рабочая папка и корень OpenSpec — frontend/; Git-корень пока на уровень выше.
  До нового указания пользователя работать внутри frontend/.
  Backend разрабатывается отдельно.
  Общие правила: AGENTS.md. Роль переноса: .agents/repository-sync.md.
  Копии коммитов сохраняют дерево и граф родителей. Обе даты отражают импорт, а Imported-from указывает исходный SHA.
  Документация по синхронизации подготовлена; runtime ещё не реализован.

rules:
  proposal:
    - Явно описывай границы задачи и влияние на frontend/backend.
  specs:
    - Каждое требование MUST иметь проверяемые сценарии WHEN/THEN.
  tasks:
    - Не отмечай runtime реализованным без выполнения проверок.
